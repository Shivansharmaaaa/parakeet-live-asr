<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcription - NVIDIA Parakeet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-record {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-record:active {
            transform: translateY(0);
        }

        .btn-stop {
            background: #e74c3c;
            color: white;
        }

        .btn-stop:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .status.recording {
            color: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        .status.idle {
            color: #666;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .transcription-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            min-height: 200px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
            position: relative;
        }

        .transcription-text {
            font-size: 1.3em;
            line-height: 1.8;
            color: #333;
            min-height: 150px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .transcription-text.empty {
            color: #999;
            font-style: italic;
        }

        .confidence {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.95em;
            color: #1976d2;
        }

        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #c62828;
            display: none;
        }

        .error.show {
            display: block;
        }

        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #e74c3c;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .recording-indicator.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Live Transcription</h1>
        <p class="subtitle">Powered by NVIDIA Parakeet CTC 1.1B ASR</p>

        <div class="controls">
            <button id="recordBtn" class="btn btn-record">Start Recording</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop Recording</button>
        </div>

        <div class="status idle" id="status">
            <span class="recording-indicator hidden" id="indicator"></span>
            <span id="statusText">Ready to record</span>
        </div>

        <div class="transcription-box">
            <div class="transcription-text empty" id="transcription">
                Your transcription will appear here...
            </div>
            <div class="confidence" id="confidence"></div>
        </div>

        <div class="error" id="error"></div>

        <div class="info">
            <strong>💡 Tips:</strong> Click "Start Recording" to begin. Speak clearly into your microphone. 
            The transcription will update in real-time. Click "Stop Recording" when finished.
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let chunkSendInterval = null;
        let streamSessionId = null;
        let eventSource = null;

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const indicator = document.getElementById('indicator');
        const transcription = document.getElementById('transcription');
        const confidence = document.getElementById('confidence');
        const errorDiv = document.getElementById('error');

        // Check for microphone access
        async function checkMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                return true;
            } catch (err) {
                showError('Microphone access denied. Please allow microphone access and refresh the page.');
                return false;
            }
        }

        async function startRecording() {
            try {
                // Start streaming session (like live_transcribe.py does)
                const sessionResponse = await fetch('/api/stream/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const sessionData = await sessionResponse.json();
                streamSessionId = sessionData.session_id;
                
                // Connect to SSE stream for real-time results
                eventSource = new EventSource(`/api/stream/${streamSessionId}`);
                eventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.status === 'connected') {
                            console.log('Streaming connected');
                        } else if (data.error) {
                            console.error('Error:', data.error);
                            showError('Transcription error: ' + data.error);
                        } else if (data.transcript) {
                            updateStreamingTranscription(data.transcript, data.confidence, data.is_final, data.is_interim);
                        }
                    } catch (err) {
                        console.error('Error parsing SSE:', err);
                    }
                };
                eventSource.onerror = (err) => {
                    console.error('SSE error:', err);
                };
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                // Try to use WAV format first, fallback to WebM
                let mimeType = 'audio/webm;codecs=opus';
                if (MediaRecorder.isTypeSupported('audio/wav')) {
                    mimeType = 'audio/wav';
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    mimeType = 'audio/webm';
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType
                });

                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    if (chunkSendInterval) {
                        clearInterval(chunkSendInterval);
                        chunkSendInterval = null;
                    }
                    if (streamSessionId) {
                        await fetch(`/api/stream/stop/${streamSessionId}`, {method: 'POST'});
                        streamSessionId = null;
                    }
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                    stream.getTracks().forEach(track => track.stop());
                };

                // Start recording with longer timeslice for better chunks
                mediaRecorder.start(2000); // Collect data every 2 seconds
                isRecording = true;

                // Update UI
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                status.className = 'status recording';
                statusText.textContent = 'Recording...';
                indicator.classList.remove('hidden');
                transcription.textContent = 'Listening...';
                transcription.className = 'transcription-text';
                confidence.textContent = '';

                // Send audio chunks continuously - like MicrophoneStream does
                // Send small chunks frequently for real-time streaming (like chunk_size=1600 frames)
                chunkSendInterval = setInterval(async () => {
                    if (mediaRecorder.state === 'recording' && audioChunks.length > 0 && streamSessionId) {
                        const chunksToSend = [...audioChunks];
                        audioChunks = [];
                        if (chunksToSend.length > 0) {
                            const audioBlob = new Blob(chunksToSend, { type: mimeType });
                            await sendStreamingChunk(audioBlob, mimeType);
                        }
                    }
                }, 500); // Send every 500ms for real-time streaming (like live_transcribe.py)

            } catch (err) {
                console.error('Error starting recording:', err);
                showError('Failed to start recording: ' + err.message);
                resetUI();
            }
        }

        async function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (chunkSendInterval) {
                clearInterval(chunkSendInterval);
                chunkSendInterval = null;
            }
            if (streamSessionId) {
                await fetch(`/api/stream/stop/${streamSessionId}`, {method: 'POST'});
                streamSessionId = null;
            }
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            isRecording = false;
            resetUI();
        }
        
        function updateStreamingTranscription(newText, confidenceValue, isFinal, isInterim) {
            const trimmedText = newText.trim();
            if (!trimmedText) return;
            
            if (isFinal) {
                // Final result - append to transcription
                if (transcription.textContent === 'Listening...' || 
                    transcription.textContent === 'Your transcription will appear here...') {
                    transcription.textContent = trimmedText;
                } else {
                    const currentText = transcription.textContent.trim();
                    // Only append if it's new content
                    if (!currentText.endsWith(trimmedText) && 
                        !currentText.toLowerCase().includes(trimmedText.toLowerCase())) {
                        transcription.textContent = currentText + ' ' + trimmedText;
                    }
                }
                transcription.className = 'transcription-text';
                confidence.textContent = `Confidence: ${(confidenceValue * 100).toFixed(1)}%`;
            } else if (isInterim) {
                // Interim result - show as preview (you can style this differently)
                const currentText = transcription.textContent.trim();
                if (currentText === 'Listening...' || currentText === 'Your transcription will appear here...') {
                    transcription.textContent = trimmedText + '...';
                    transcription.className = 'transcription-text';
                } else {
                    // Show interim as preview at the end
                    const baseText = currentText.replace(/\.\.\.$/, '');
                    transcription.textContent = baseText + ' ' + trimmedText + '...';
                }
            }
            hideError();
        }
        
        async function sendStreamingChunk(audioBlob, mimeType) {
            try {
                // Always convert to WAV to ensure proper format
                let wavBlob;
                try {
                    wavBlob = await convertToWav(audioBlob);
                    console.log(`Converted to WAV: ${wavBlob.size} bytes`);
                } catch (err) {
                    console.error('WAV conversion failed:', err);
                    // Don't send if conversion fails
                    return;
                }
                
                // Convert to base64 and send
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Audio = reader.result;
                    if (streamSessionId) {
                        try {
                            const response = await fetch('/api/stream/chunk', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    session_id: streamSessionId,
                                    audio: base64Audio
                                })
                            });
                            const result = await response.json();
                            if (result.error) {
                                console.error('Server error:', result.error);
                            }
                        } catch (err) {
                            console.error('Error sending chunk to server:', err);
                        }
                    }
                };
                reader.readAsDataURL(wavBlob);
            } catch (err) {
                console.error('Error in sendStreamingChunk:', err);
            }
        }

        function resetUI() {
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.className = 'status idle';
            statusText.textContent = 'Ready to record';
            indicator.classList.add('hidden');
        }

        async function convertToWav(audioBlob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
                        const arrayBuffer = reader.result;
                        
                        // Decode audio data
                        let audioBuffer;
                        try {
                            audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        } catch (err) {
                            // If decode fails, try creating from raw data
                            console.warn('Decode failed, trying alternative method:', err);
                            throw err;
                        }
                        
                        // Resample to 16kHz if needed
                        if (audioBuffer.sampleRate !== 16000) {
                            const offlineContext = new OfflineAudioContext(1, audioBuffer.length * 16000 / audioBuffer.sampleRate, 16000);
                            const source = offlineContext.createBufferSource();
                            source.buffer = audioBuffer;
                            source.connect(offlineContext.destination);
                            source.start();
                            audioBuffer = await offlineContext.startRendering();
                        }
                        
                        // Convert to mono if needed
                        if (audioBuffer.numberOfChannels > 1) {
                            const monoBuffer = audioContext.createBuffer(1, audioBuffer.length, audioBuffer.sampleRate);
                            const leftChannel = audioBuffer.getChannelData(0);
                            const rightChannel = audioBuffer.getChannelData(1);
                            const monoData = monoBuffer.getChannelData(0);
                            for (let i = 0; i < audioBuffer.length; i++) {
                                monoData[i] = (leftChannel[i] + rightChannel[i]) / 2;
                            }
                            audioBuffer = monoBuffer;
                        }
                        
                        // Convert to WAV with proper RIFF header
                        const wav = audioBufferToWav(audioBuffer);
                        const wavBlob = new Blob([wav], { type: 'audio/wav' });
                        
                        // Verify it's a valid WAV
                        const verifyReader = new FileReader();
                        verifyReader.onload = () => {
                            const bytes = new Uint8Array(verifyReader.result);
                            if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
                                console.log('Valid WAV file created:', wavBlob.size, 'bytes');
                                resolve(wavBlob);
                            } else {
                                console.error('Invalid WAV header created');
                                reject(new Error('Failed to create valid WAV file'));
                            }
                        };
                        verifyReader.readAsArrayBuffer(wavBlob);
                    } catch (err) {
                        console.error('WAV conversion failed:', err);
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(audioBlob);
            });
        }

        function audioBufferToWav(buffer) {
            const length = buffer.length;
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bytesPerSample = 2;
            const blockAlign = numberOfChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = length * blockAlign;
            const bufferSize = 44 + dataSize;
            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);
            
            // Helper to write strings
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            // RIFF header (must be first 4 bytes: 'RIFF')
            writeString(0, 'RIFF');
            view.setUint32(4, bufferSize - 8, true); // File size - 8 (little-endian)
            writeString(8, 'WAVE');
            
            // fmt chunk
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true); // fmt chunk size (16 for PCM)
            view.setUint16(20, 1, true); // Audio format (1 = PCM, little-endian)
            view.setUint16(22, numberOfChannels, true); // Number of channels
            view.setUint32(24, sampleRate, true); // Sample rate
            view.setUint32(28, byteRate, true); // Byte rate
            view.setUint16(32, blockAlign, true); // Block align
            view.setUint16(34, 16, true); // Bits per sample
            
            // data chunk
            writeString(36, 'data');
            view.setUint32(40, dataSize, true); // Data size
            
            // Convert float samples (-1.0 to 1.0) to 16-bit PCM (little-endian)
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    // Convert to 16-bit signed integer
                    const int16Sample = Math.max(-32768, Math.min(32767, Math.floor(sample * 32767)));
                    view.setInt16(offset, int16Sample, true); // Little-endian
                    offset += 2;
                }
            }
            
            // Verify RIFF header was written correctly
            if (view.getUint8(0) !== 0x52 || view.getUint8(1) !== 0x49 || 
                view.getUint8(2) !== 0x46 || view.getUint8(3) !== 0x46) {
                console.error('RIFF header not written correctly!');
            }
            
            return arrayBuffer;
        }

        async function transcribeAudio(audioBlob) {
            try {
                // Try to convert to WAV if needed
                let wavBlob = audioBlob;
                if (!audioBlob.type.includes('wav')) {
                    try {
                        wavBlob = await convertToWav(audioBlob);
                    } catch (err) {
                        console.warn('Could not convert to WAV, using original format:', err);
                    }
                }
                
                // Convert to base64
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Audio = reader.result;

                    const response = await fetch('/api/transcribe', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            audio: base64Audio
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        if (data.transcript) {
                            const newText = data.transcript.trim();
                            if (newText) {
                                // Only update if confidence is reasonable (> 0.3 or 30%)
                                const conf = data.confidence || 0;
                                if (conf > 0.3) {
                                    // Clear "Listening..." message
                                    if (transcription.textContent === 'Listening...' || 
                                        transcription.textContent === 'Your transcription will appear here...') {
                                        transcription.textContent = newText;
                                    } else {
                                        // Append with space, avoiding exact duplicates
                                        const currentText = transcription.textContent.trim();
                                        // Only append if it's new content and not already there
                                        if (!currentText.endsWith(newText) && 
                                            !currentText.includes(newText + ' ') &&
                                            !currentText.toLowerCase().includes(newText.toLowerCase())) {
                                            transcription.textContent = currentText + ' ' + newText;
                                        }
                                    }
                                    transcription.className = 'transcription-text';
                                    confidence.textContent = `Confidence: ${(conf * 100).toFixed(1)}%`;
                                    hideError();
                                } else {
                                    console.log(`Low confidence (${(conf * 100).toFixed(1)}%), skipping: "${newText}"`);
                                }
                            }
                        }
                    } else if (data.error) {
                        showError('Transcription error: ' + data.error);
                    }
                };

                reader.readAsDataURL(wavBlob);
            } catch (err) {
                console.error('Error transcribing:', err);
                showError('Failed to transcribe audio: ' + err.message);
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }

        // Event listeners
        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);

        // Check microphone on load
        window.addEventListener('load', async () => {
            const hasMic = await checkMicrophone();
            if (!hasMic) {
                recordBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
